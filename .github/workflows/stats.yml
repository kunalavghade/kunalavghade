name: Stats Cards
on:
  schedule: [{ cron: "30 */6 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/stats.yml]
permissions:
  contents: write
jobs:
  top-langs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=kunalavghade&langs_count=10&layout=compact&theme=transparent&hide_border=true
          path: top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit card
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add top-langs.svg
          git commit -m "Update stats cards [skip ci]" || exit 0
          git push
